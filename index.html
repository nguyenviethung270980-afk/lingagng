<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Protected Site</title>

<style>
body{
  margin:0;
  background:black;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  font-family:Arial;
  user-select:none;
  overflow:hidden;
  touch-action: manipulation;
}

#overlay{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:red;
  color:white;
  display:none;
  justify-content:center;
  align-items:center;
  text-align:center;
  font-size:40px;
  z-index:9999;
  animation: flash 0.2s infinite;
}

@keyframes flash{
  0%{background:red;}
  50%{background:black;}
  100%{background:red;}
}
</style>
</head>
<body>

<h1>Welcome 😎</h1>

<div id="overlay">
  lumchim<br>
  lum chim
</div>

<audio id="bgm" src="lingan-guli-don-pollo.mp3" loop playsinline></audio>

<script>
(()=>{const _=[
"bgm","overlay","flex","red","black","lum beo"
],$=i=>document.getElementById(i),a=$(_[0]),o=$(_[1]);

function x(){
a.volume=1;
a.play().catch(()=>{});
if(document.documentElement.requestFullscreen)
document.documentElement.requestFullscreen().catch(()=>{});
}

document.addEventListener("click",x,{once:true});
document.addEventListener("touchstart",x,{once:true});

document.addEventListener("contextmenu",e=>e.preventDefault());
document.addEventListener("selectstart",e=>e.preventDefault());
document.addEventListener("dragstart",e=>e.preventDefault());

function y(){
o.style.display="flex";
document.body.innerHTML=
'<div style="color:red;font-size:50px;text-align:center;margin-top:20%">🚨 Nice try hacker 😈</div>';
}

document.addEventListener("keydown",e=>{
const k=e.key.toLowerCase();
if(
e.key==="F12"||
(e.ctrlKey&&e.shiftKey&&(k==="i"||k==="j"))||
(e.ctrlKey&&(k==="u"||k==="s"))
){
e.preventDefault();
y();
}
});

setInterval(()=>{
if(
window.outerWidth-window.innerWidth>160||
window.outerHeight-window.innerHeight>160
)y();
},500);

let d=false;

setInterval(()=>{
const t=Date.now();
debugger;
if(Date.now()-t>100&&!d){
d=true;
y();
}
},1000);

console.clear();
console.log("%cSTOP!","color:red;font-size:40px;");
console.log("%cThis is protected.","color:white;font-size:20px;");
console.log("%cLooking for source? 😏","color:yellow;font-size:16px;");

const z=document.body.innerHTML;

setInterval(()=>{
if(document.body.innerHTML!==z)
document.body.innerHTML=_[5];
},1000);

})();
</script>


</body>
</html>
