<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Protected Site</title>

<style>
body{
  margin:0;
  background:black;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  font-family:Arial;
  user-select:none;
  overflow:hidden;
  touch-action: manipulation;
}

#overlay{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:red;
  color:white;
  display:none;
  justify-content:center;
  align-items:center;
  text-align:center;
  font-size:40px;
  z-index:9999;
  animation: flash 0.2s infinite;
}

@keyframes flash{
  0%{background:red;}
  50%{background:black;}
  100%{background:red;}
}
</style>
</head>
<body>

<h1>Welcome 😎</h1>

<div id="overlay">
  👀 STOP RIGHT THERE<br>
  Soi code làm gì bro???
</div>

<!-- 🎵 Background Music -->
<audio id="bgm" src="lingan-guli-don-pollo.mp3" loop playsinline></audio>

<script>

const audio = document.getElementById("bgm");

/* =====================
   AUTO PLAY WHEN CLICK
===================== */

function startMusic() {

  audio.volume = 1.0;
  audio.play().catch(()=>{});

  if (document.documentElement.requestFullscreen) {
    document.documentElement.requestFullscreen().catch(()=>{});
  }
}

// Works for PC + Mobile
document.addEventListener("click", startMusic, { once: true });
document.addEventListener("touchstart", startMusic, { once: true });

/* =====================
   YOUR ORIGINAL CODE
===================== */

// Disable right click
document.addEventListener("contextmenu", e => e.preventDefault());

// Disable text selection
document.addEventListener("selectstart", e => e.preventDefault());

// Disable drag
document.addEventListener("dragstart", e => e.preventDefault());

// Block common inspect keys
document.addEventListener("keydown", function(e) {
  if (
    e.key === "F12" ||
    (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === "i") ||
    (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === "j") ||
    (e.ctrlKey && e.key.toLowerCase() === "u") ||
    (e.ctrlKey && e.key.toLowerCase() === "s")
  ){
    e.preventDefault();
    triggerWarning();
  }
});

// Detect DevTools open
setInterval(function(){
  if(window.outerWidth - window.innerWidth > 160 ||
     window.outerHeight - window.innerHeight > 160){
      triggerWarning();
  }
},500);

// Detect console open
let devtools = false;
setInterval(function(){
  const start = new Date();
  debugger;
  const end = new Date();
  if(end - start > 100){
    if(!devtools){
      devtools = true;
      triggerWarning();
    }
  }
},1000);

// Trigger warning
function triggerWarning(){
  document.getElementById("overlay").style.display="flex";
  document.body.innerHTML = `
    <div style="color:red;font-size:50px;text-align:center;margin-top:20%">
    🚨 Nice try hacker 😈
    </div>
  `;
}

// Console troll
console.clear();
console.log("%cSTOP!", "color:red;font-size:40px;");
console.log("%cThis is protected.", "color:white;font-size:20px;");
console.log("%cLooking for source? 😏", "color:yellow;font-size:16px;");

// Infinite loop if tampered
let original = document.body.innerHTML;
setInterval(function(){
  if(document.body.innerHTML !== original){
    document.body.innerHTML = "Bình puồi";
  }
},1000);

</script>

</body>
</html>
